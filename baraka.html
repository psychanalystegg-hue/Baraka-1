<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>نظام البركة v2</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0f2b4a"/>
<link rel="icon" href="icon-192.png" type="image/png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="البركة"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--p:#0f2b4a;--p2:#1a4a7a;--p3:#e8f0fb;--a:#f59e0b;--a2:#fef3c7;--g:#10b981;--g2:#d1fae5;--r:#ef4444;--r2:#fee2e2;--wa:#25d366;--bg:#eef2f7;--sur:#fff;--bdr:#e2e8f0;--txt:#1e293b;--mt:#64748b;--sw:160px;--rad:12px;--shd:0 2px 20px rgba(0,0,0,.07)}
html{overflow-x:hidden;width:100%}
body{font-family:'Cairo','Arial',sans-serif;background:var(--bg);color:var(--txt);direction:rtl;margin:0;overflow-x:hidden;width:100%;position:relative}
.app{display:flex;min-height:100vh;overflow-x:hidden;max-width:100vw}
.nav{width:var(--sw);background:var(--p);display:flex;flex-direction:column;position:fixed;top:0;right:0;height:100vh;z-index:200;overflow-y:auto}
.nav-brand{padding:10px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.1)}
.nb-icon{font-size:20px}.nb-name{color:#fff;font-weight:900;font-size:13px;line-height:1.1}
.nb-ver{background:var(--a);color:#111;font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;margin-top:3px;display:inline-block}
.nl{list-style:none;padding:10px 8px;flex:1}
.ni{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:7px;cursor:pointer;color:rgba(255,255,255,.72);font-size:11px;font-weight:600;transition:.15s;margin-bottom:1px;user-select:none}
.ni:hover{background:rgba(255,255,255,.1);color:#fff}.ni.act{background:var(--a);color:#0f2b4a}
.nbdg{margin-right:auto;background:var(--r);color:#fff;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700;min-width:22px;text-align:center}
.nbdg.wa{background:var(--wa)}.nav-foot{padding:12px 16px;color:rgba(255,255,255,.3);font-size:10px;border-top:1px solid rgba(255,255,255,.07);text-align:center}
.main{margin-right:var(--sw);flex:1;min-width:0}.pg{padding:16px 12px;max-width:1340px;display:none}.pg.act{display:block}
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.ph-l h1{font-size:24px;font-weight:900;color:var(--p)}.ph-l p{color:var(--mt);font-size:13px;margin-top:2px}
.ph-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.sc{background:var(--sur);border-radius:var(--rad);padding:18px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shd);border-right:4px solid transparent}
.sc.blue{border-color:var(--p2)}.sc.green{border-color:var(--g)}.sc.amber{border-color:var(--a)}.sc.red{border-color:var(--r)}
.sc-ico{font-size:34px}.sc-num{font-size:30px;font-weight:900;color:var(--p);line-height:1}.sc-lbl{font-size:12px;color:var(--mt);margin-top:3px}
.rg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.rg-card{background:var(--sur);border-radius:var(--rad);padding:16px;box-shadow:var(--shd);border:1px solid var(--bdr);cursor:pointer;transition:.15s}
.rg-card:hover{border-color:var(--p2);transform:translateY(-2px)}
.rc-name{font-weight:700;font-size:15px;color:var(--p);margin-bottom:10px;border-bottom:2px solid var(--a);padding-bottom:6px}
.rc-row{display:flex;justify-content:space-between;font-size:12px;color:var(--mt);margin-bottom:4px}
.rc-tot{margin-top:10px;font-size:17px;font-weight:900;color:var(--p);text-align:left}
.rc-bar{height:4px;background:var(--bdr);border-radius:2px;margin-top:8px;overflow:hidden}
.rc-fill{height:100%;background:var(--g);border-radius:2px}
.filt{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filt select,.filt input,.sinp{padding:9px 12px;border:1px solid var(--bdr);border-radius:8px;font-family:'Cairo','Arial',sans-serif;font-size:13px;background:var(--sur);outline:none;color:var(--txt)}
.filt select:focus,.sinp:focus{border-color:var(--p2)}.sinp{min-width:200px;flex:1}
.bill-bar{background:var(--sur);border-radius:6px;padding:5px 10px;margin-bottom:6px;border:1px solid var(--a);display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.sbar{display:flex;flex-wrap:nowrap;background:var(--p);border-radius:6px;margin-bottom:6px;overflow:hidden}
.si{padding:3px 7px;flex:1;min-width:55px;border-left:1px solid rgba(255,255,255,.09)}
.si span{color:rgba(255,255,255,.5);font-size:8px;display:block}
.si strong{color:#fff;font-size:10px;font-weight:700}
.si span{color:rgba(255,255,255,.5);font-size:8px;display:block;margin-bottom:1px}
.si strong{color:#fff;font-size:10px;font-weight:700}
.si span{color:rgba(255,255,255,.55);font-size:9px;display:block;margin-bottom:1px}
.si strong{color:#fff;font-size:11px;font-weight:700}
.si span{color:rgba(255,255,255,.55);font-size:11px;display:block;margin-bottom:2px}.si strong{color:#fff;font-size:14px;font-weight:700}
.tw{background:var(--sur);border-radius:var(--rad);box-shadow:var(--shd);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--p);color:#fff;padding:7px 6px;font-size:11px;font-weight:600;text-align:center;white-space:nowrap}
td{padding:6px 6px;font-size:11px;text-align:center;border-bottom:1px solid var(--bdr);vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:#f8faff}
.debt{color:var(--r);font-weight:700}
.bdg{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;border:none;display:inline-block}
.bdg.gr{background:var(--g2);color:#065f46}.bdg.rd{background:var(--r2);color:#991b1b}
.bdg.gy{background:#f1f5f9;color:var(--mt);cursor:default}.bdg.am{background:var(--a2);color:#92400e}
.bp{background:var(--p);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-family:'Cairo','Arial',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.bp:hover{background:var(--p2)}
.bg{background:transparent;color:var(--mt);border:1px solid var(--bdr);padding:9px 18px;border-radius:8px;font-family:'Cairo','Arial',sans-serif;font-size:13px;cursor:pointer}
.bg:hover{background:var(--bg)}
.bw{background:var(--wa);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-family:'Cairo','Arial',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.br{background:var(--r);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-family:'Cairo','Arial',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.bs{padding:5px 9px;border-radius:6px;border:1px solid var(--bdr);background:var(--sur);cursor:pointer;font-size:12px;margin:1px;transition:.13s}
.bs:hover{background:var(--bg)}.bs.e{border-color:#fca5a5;color:var(--r)}.bs.e:hover{background:var(--r2)}
.bs.w{border-color:#86efac;color:#166534}.bs.w:hover{background:#dcfce7}
.bs.p{border-color:#93c5fd;color:var(--p2)}.bs.p:hover{background:var(--p3)}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--sur);border-radius:16px;width:100%;max-width:600px;max-height:94vh;overflow-y:auto;padding:26px;box-shadow:0 24px 64px rgba(0,0,0,.22)}
.md.w{max-width:800px}
.md-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.md-hd h2{font-size:19px;font-weight:900;color:var(--p)}
.md-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--mt);padding:2px 8px;border-radius:6px}
.md-x:hover{background:var(--bg)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:14px}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--txt)}
.lbl input,.lbl select,.lbl textarea{padding:9px 10px;border:1px solid var(--bdr);border-radius:8px;font-family:'Cairo','Arial',sans-serif;font-size:13px;outline:none;color:var(--txt)}
.lbl input:focus,.lbl select:focus{border-color:var(--p2)}
.lbl input.hl{background:#eff6ff;border-color:var(--p2);font-weight:700;color:var(--p)}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 14px;font-size:13px;color:#92400e;margin-bottom:14px}
.info{background:var(--p3);border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--p2);margin-bottom:14px}
.ma{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.cb{background:#f8fafc;border:1px solid var(--bdr);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.cb-ttl{font-weight:700;color:var(--p);margin-bottom:10px;font-size:14px}
.cr{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--bdr)}
.cr:last-child{border:none}.cr span{color:var(--mt)}.cr strong{font-weight:700}
.cr.tot{font-size:16px;font-weight:900;color:var(--p);padding-top:10px;margin-top:6px;border-top:2px solid var(--p)!important;border-bottom:none!important}
.cr.tot span,.cr.tot strong{color:var(--p)}
.paid-lbl{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;padding:10px 14px;background:var(--g2);border-radius:8px;color:#065f46;border:1px solid #6ee7b7;user-select:none}
.paid-lbl input{width:18px;height:18px;cursor:pointer;accent-color:var(--g)}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:18px;border:1px solid var(--bdr)}
.tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mt);border:none;background:none;font-family:'Cairo','Arial',sans-serif}
.tab.act{background:var(--sur);color:var(--p);box-shadow:0 1px 6px rgba(0,0,0,.1)}
.set-section{background:var(--sur);border-radius:var(--rad);box-shadow:var(--shd);padding:22px;margin-bottom:18px}
.set-section h3{font-size:15px;font-weight:700;color:var(--p);margin-bottom:16px;border-bottom:2px solid var(--a);padding-bottom:8px}
/* Profile page */
.profile-hd{background:linear-gradient(135deg,var(--p),var(--p2));border-radius:var(--rad);padding:24px;color:#fff;margin-bottom:20px;display:flex;align-items:center;gap:18px}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#111;flex-shrink:0}
.profile-info h2{font-size:20px;font-weight:900;margin-bottom:4px}
.profile-info p{opacity:.8;font-size:13px}
.profile-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.ps{background:var(--sur);border-radius:10px;padding:14px;box-shadow:var(--shd);text-align:center}
.ps-num{font-size:22px;font-weight:900;color:var(--p)}.ps-lbl{font-size:11px;color:var(--mt);margin-top:3px}
/* Monthly report */
.rep-section{background:var(--sur);border-radius:var(--rad);box-shadow:var(--shd);padding:20px;margin-bottom:16px}
.rep-section h3{font-size:15px;font-weight:700;color:var(--p);margin-bottom:14px;border-bottom:2px solid var(--a);padding-bottom:8px}
.rep-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--bdr);font-size:13px}
.rep-row:last-child{border:none}.rep-row strong{color:var(--p);font-weight:700}
.rep-total{display:flex;justify-content:space-between;padding:12px 14px;background:var(--p);border-radius:8px;color:#fff;font-size:15px;font-weight:700;margin-top:10px}
/* Search highlight */
.srch-hl{background:#fef9c3;border-radius:3px;padding:0 2px}
/* Backup reminder */
.backup-bar{background:var(--a2);border:1px solid var(--a);border-radius:8px;padding:10px 16px;font-size:13px;color:#92400e;display:flex;align-items:center;gap:10px;margin-bottom:16px}
/* Debt carry badge */
.debt-carry{background:#fee2e2;border:1px solid #fca5a5;border-radius:6px;padding:4px 10px;font-size:12px;color:#991b1b;font-weight:700}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 28px;border-radius:10px;font-weight:700;font-size:14px;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.18);animation:sup .28s ease;white-space:nowrap}
.tok{background:#065f46;color:#fff}.terr{background:var(--r);color:#fff}.tinf{background:var(--p);color:#fff}
@keyframes sup{from{transform:translateX(-50%) translateY(16px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.empty{text-align:center;color:var(--mt);padding:48px;font-size:15px}
.chip{display:inline-flex;align-items:center;background:var(--p3);color:var(--p2);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.sr{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.src{flex:1;min-width:150px;background:var(--sur);border-radius:10px;padding:13px 16px;box-shadow:var(--shd);border-right:3px solid var(--bdr)}
.src.b{border-color:var(--p2)}.src.g{border-color:var(--g)}.src.r{border-color:var(--r)}.src.a{border-color:var(--a)}
.src span{font-size:11px;color:var(--mt);display:block}.src strong{font-size:19px;font-weight:900;color:var(--p)}
.arch-s{display:flex;gap:16px;flex-wrap:wrap;background:var(--sur);border-radius:10px;padding:13px 18px;margin-bottom:14px;box-shadow:var(--shd);font-size:13px;font-weight:600;align-items:center}
.topbar{display:none}
.nav-ovl{display:none}
@media(max-width:800px){
  :root{--sw:0px}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--p);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:150;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .topbar .tb-brand{display:flex;align-items:center;gap:6px;font-weight:900;font-size:13px}
  .topbar .tb-brand .nb-ver{background:var(--a);color:#111;font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px}
  .tb-burger{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;width:38px;height:36px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .main{margin-right:0}
  .pg{padding:14px}
  .stats4{grid-template-columns:repeat(2,1fr)}
  .fg2,.fg3,.fg4{grid-template-columns:1fr}
  .sbar{flex-direction:column}
  .sr{flex-direction:column}
  .app{flex-direction:column}
  .topbar{width:100%}
  .main{width:100%}
  .nav{width:78vw;max-width:280px;transform:translateX(100%);transition:transform .25s ease;box-shadow:-4px 0 24px rgba(0,0,0,.3)}
  .nav.open{transform:translateX(0)}
  .nav-ovl{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .nav-ovl.open{opacity:1;pointer-events:auto}
  .ni{font-size:13px;padding:10px 12px}
  .md{padding:18px}
}
@media(max-width:420px){
  .sc-num{font-size:24px}
  .ph-l h1{font-size:19px}
}

/* ─── LOCK SCREEN ─── */
.lock-screen{position:fixed;inset:0;background:var(--p);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
.lock-card{background:#fff;border-radius:16px;padding:36px 40px;text-align:center;width:300px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.lock-card h2{font-size:18px;font-weight:900;color:var(--p);margin-bottom:6px}
.lock-card p{font-size:12px;color:var(--mt);margin-bottom:20px}
.lock-input{width:100%;padding:12px;border:2px solid var(--bdr);border-radius:8px;font-family:Cairo,Arial,sans-serif;font-size:16px;text-align:center;outline:none;letter-spacing:4px;margin-bottom:12px}
.lock-input:focus{border-color:var(--p2)}
.lock-err{color:var(--r);font-size:12px;margin-bottom:10px;min-height:16px}
/* ─── DARK MODE ─── */
body.dark{--bg:#0f172a;--sur:#1e293b;--bdr:#334155;--txt:#e2e8f0;--mt:#94a3b8;--p3:#1e3a5f;--a2:#451a03;--g2:#052e16;--r2:#450a0a}
body.dark .nav{background:#020617}
body.dark .tw{box-shadow:none}
/* ─── FONT SIZE ─── */
body.fs-sm{font-size:11px}body.fs-md{font-size:13px}body.fs-lg{font-size:15px}
/* ─── STATS YEAR ─── */
.year-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.ys-card{background:var(--sur);border-radius:10px;padding:12px;box-shadow:var(--shd);text-align:center;border-top:3px solid var(--p2)}
.ys-card .num{font-size:20px;font-weight:900;color:var(--p)}.ys-card .lbl{font-size:10px;color:var(--mt);margin-top:2px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="tb-brand"><span>⚡</span><span id="tb-orgname">البركة</span><span class="nb-ver">v2.0</span></div>
    <button class="tb-burger" onclick="toggleMobileNav()" id="tb-burger-btn">☰</button>
  </div>
  <div class="nav-ovl" id="nav-ovl" onclick="toggleMobileNav(false)"></div>
  <nav class="nav" id="mainNav">
    <div class="nav-brand">
      <div class="nb-icon">⚡</div>
      <div><div class="nb-name" id="nav-orgname">البركة</div><span class="nb-ver">v2.0</span></div>
    </div>
    <ul class="nl" id="navlist"></ul>
    <div style="padding:8px;display:flex;gap:4px;justify-content:center;border-top:1px solid rgba(255,255,255,.07)">
      <button onclick="window.toggleDarkMode()" title="وضع ليلي" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px">🌙</button>
      <button onclick="window.changeFontSize(-1)" title="تصغير" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700">A-</button>
      <button onclick="window.changeFontSize(1)" title="تكبير" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700">A+</button>
    </div>
    <div style="padding:8px 10px 10px">
      <button onclick="window.logoutApp()" style="width:100%;background:rgba(239,68,68,.5);border:1px solid rgba(239,68,68,.7);color:#fff;border-radius:8px;padding:9px 10px;cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">🚪 تسجيل الخروج</button>
    </div>
    <div class="nav-foot" style="font-size:11px">يعمل بدون إنترنت ✓</div>
  </nav>
  <main class="main" id="main-content"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<script>

// ═══ Polyfills for Windows 7 Chrome ═══
if(!Object.assign){Object.assign=function(t){for(var i=1;i<arguments.length;i++){var s=arguments[i];for(var k in s){if(Object.prototype.hasOwnProperty.call(s,k))t[k]=s[k];}}return t;};}
if(!Array.prototype.find){Array.prototype.find=function(fn){for(var i=0;i<this.length;i++){if(fn(this[i],i,this))return this[i];}return undefined;};}
if(!Array.prototype.findIndex){Array.prototype.findIndex=function(fn){for(var i=0;i<this.length;i++){if(fn(this[i],i,this))return i;}return -1;};}
if(!Array.prototype.includes){Array.prototype.includes=function(v){return this.indexOf(v)!==-1;};}
if(!String.prototype.padStart){String.prototype.padStart=function(len,ch){var s=this;ch=ch||' ';while(s.length<len)s=ch+s;return s;};}

function buildInvoices(regions,customers,readings){
  var groups={};
  readings.forEach(function(r){
    var c=customers.find(function(x){return x.id===r.customerId;});
    if(!c)return;
    var k=c.regionId+"_"+r.year+"_"+r.month;
    if(!groups[k])groups[k]={regionId:c.regionId,year:r.year,month:r.month,readings:[]};
    groups[k].readings.push(_merge(r,{customer:c}));
  });
  var invs=[];
  Object.values(groups).forEach(function(g){
    var region=regions.find(function(r){return r.id===g.regionId;});
    if(!region)return;
    var totC=g.readings.reduce(function(s,r){return s+Math.max(0,r.curr-r.prev);},0);
    var up=(totC>0&&region.totalBill>615.60)?ceil2p((region.totalBill-615.60)/totC):0;
    g.readings.forEach(function(r){
      var cons=Math.max(0,r.curr-r.prev);
      var ca=totC>0?ceil2(cons*up):zeroShare(region.totalBill,totC,g.readings.length);
      var td=ceil2(ca+region.meterRent+region.meterMaint+region.transformerMaint+region.inspector+(r.customer.debt||0));

// عند استهلاك المنطقة = 0: يُقسَّم (مبلغ الفاتورة − 615.60) بالتساوي على منخرطي المنطقة
function zeroShare(bill,totC,nCust){
  if(totC>0||!(bill>615.60)||!(nCust>0))return 0;
  return ceil2((bill-615.60)/nCust);
}
function getRegionBill(regionId,year,month){
  var key=regionId+"_"+year+"_"+month;
  if(DB.regionBills&&DB.regionBills[key]>0)return DB.regionBills[key];
  return 0;
}

function getCusts(rid){return DB.customers.filter(function(c){return c.regionId===rid;});}
function getInv(cid,y,m){return DB.invoices.find(function(x){return x.customerId===cid&&x.year===y&&x.month===m;});}
function getPrevR(cid,y,m){
  var py=y,pm=m-1;if(pm===0){pm=12;py--;}
  var pi=DB.invoices.find(function(x){return x.customerId===cid&&x.year===py&&x.month===pm;});
  if(pi)return pi.currReading;
  var pr=DB.readings.find(function(x){return x.customerId===cid&&x.year===py&&x.month===pm;});
  return pr?pr.curr:0;
}
function getRegSum(rid,y,m){
  var region=DB.regions.find(function(r){return r.id===rid;});if(!region)return null;
  var custs=getCusts(rid);
  var invs=custs.map(function(c){return getInv(c.id,y,m);}).filter(Boolean);
  var totC=invs.reduce(function(s,x){return s+(x.consumption||0);},0);
  var bill=getRegionBill(rid,y,m);
  var up=(totC>0&&bill>615.60)?ceil2p((bill-615.60)/totC):0;
  return{totC:totC,up:up,zShare:zeroShare(bill,totC,invs.length),bill:bill,totDue:invs.reduce(function(s,x){return s+(x.totalDue||0);},0),
    invCount:invs.length,custCount:custs.length,paidCount:invs.filter(function(x){return x.paid;}).length};
}
function recalcRegion(regionId,year,month,bill,nR,nI){
  var custs=getCusts(regionId);
  var region=DB.regions.find(function(r){return r.id===regionId;});
  if(!region)return nI;
  var allR=(nR||DB.readings).filter(function(r){
    return custs.some(function(c){return c.id===r.customerId;})&&r.year===year&&r.month===month;
  });
  var totC=allR.reduce(function(s,r){return s+Math.max(0,r.curr-r.prev);},0);
  var up=(totC>0&&bill>615.60)?ceil2p((bill-615.60)/totC):0;
  var result=nI?nI.slice():DB.invoices.slice();
  allR.forEach(function(r){
    var cust=DB.customers.find(function(x){return x.id===r.customerId;});
    if(!cust)return;
    var cons=Math.max(0,r.curr-r.prev);
    var ca=totC>0?ceil2(cons*up):zeroShare(bill,totC,allR.length);
    var td=ceil2(ca+region.meterRent+region.meterMaint+region.transformerMaint+region.inspector+(cust.debt||0));
    var ex=result.find(function(x){return x.customerId===r.customerId&&x.year===year&&x.month===month;});
    if(ex){
      result=result.map(function(x){
        if(x.id===ex.id)return _merge(x,{unitPrice:up,consumptionAmt:ca,totalDue:td,consumption:cons,prevReading:r.prev,currReading:r.curr});
        return x;
      });
    }
  });
  return result;
}

  var inv=DB.invoices.find(function(x){return x.id===id;});
  var c=DB.customers.find(function(x){return x.id===(inv&&inv.customerId);});
  var r=DB.regions.find(function(x){return x.id===(inv&&inv.regionId);});
  if(!inv||!c||!r){showToast("تعذّر إيجاد الفاتورة","err");return;}
  var no=nextReceiptNo();
  var html=receiptHTML(inv,c,r,no);
  var iframe=document.getElementById("_pf");
  if(iframe)iframe.remove();
  iframe=document.createElement("iframe");
  iframe.id="_pf";
  iframe.style.cssText="position:fixed;top:-9999px;left:-9999px;width:210mm;height:297mm;border:none;visibility:hidden";
  document.body.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(html);
  iframe.contentDocument.close();
  iframe.onload=function(){setTimeout(function(){iframe.contentWindow.focus();iframe.contentWindow.print();},600);};
  showToast("🧾 وصل رقم "+no+" — جاري التحضير...");
};

function buildWAMsg(inv,c,r){
  var cm=consumptionMonth(inv.prevCheckDate);
  var cml=cm?cm.label:ml(inv.year,inv.month);
  var year=inv.dueDate?parseInt(inv.dueDate.split("/")[2])||new Date().getFullYear():new Date().getFullYear();
  return "السلام عليكم "+c.name+" 🌙\n\n"
    +"━━━━━━━━━━━━━━━━━\n"
    +"⚡ *فاتورة الكهرباء*\n"
    +"📅 شهر الاستهلاك: *"+cml+"*\n"
    +"🏘️ المنطقة: "+r.name+"\n"
    +"━━━━━━━━━━━━━━━━━\n"
    +"📊 *قراءة العداد*\n"
    +"▪️ السابق: "+inv.prevReading+"\n"
    +"▪️ الحالي: "+inv.currReading+"\n"
    +"▪️ الاستهلاك: *"+inv.consumption+" كيلواط*\n"
    +"▪️ سعر الوحدة: "+n2(inv.unitPrice)+" د/ك\n"
    +"━━━━━━━━━━━━━━━━━\n"
    +"💵 *الواجب أداؤه: "+n2(inv.totalDue)+" درهم*\n"
    +"📆 آخر أجل: *"+inv.dueDate+"*\n"
    +"━━━━━━━━━━━━━━━━━\n"
    +"🌾 الموسم الفلاحي "+year;
}
function sendWA(inv,c,r){
  if(!c.phone){alert("لا يوجد رقم هاتف لهذا المنخرط");return false;}
  var phone=fmtPhone(c.phone);
  if(!phone||phone.length<11){alert("رقم الهاتف غير صحيح: "+c.phone);return false;}
  var url="https://wa.me/"+phone+"?text="+encodeURIComponent(buildWAMsg(inv,c,r));
  window.open(url,"_blank");
  return true;
}
function buildSMSMsg(inv,c,r){
  var orgName=DB.settings&&DB.settings.orgName?DB.settings.orgName:"GROUPEMENT ELBARAKA";
  var cm=consumptionMonth(inv.prevCheckDate);
  var cml=cm?cm.label:ml(inv.year,inv.month);
  return orgName+"\n"
    +"السلام عليكم "+c.name+"\n"
    +"شهر الاستهلاك: "+cml+"\n"
    +"الاستهلاك: "+inv.consumption+" ك\n"
    +"الواجب: "+n2(inv.totalDue)+" درهم\n"
    +"آخر أجل: "+inv.dueDate;
}
function sendSMS(inv,c,r){
  if(!c.phone){alert("لا يوجد رقم هاتف لهذا المنخرط");return false;}
  var phone=c.phone.replace(/\D/g,"");
  var msg=buildSMSMsg(inv,c,r);
  // sms: URL — يفتح تطبيق الرسائل مباشرة على الهاتف
  var url="sms:"+phone+"?body="+encodeURIComponent(msg);
  window.location.href=url;
  return true;
}

var currentPage="dashboard";
var PAGES=[
  {id:"dashboard",icon:"📊",label:"لوحة التحكم"},
  {id:"regions",icon:"🗺️",label:"المناطق"},
  {id:"customers",icon:"👥",label:"المنخرطون"},
  {id:"readings",icon:"⚡",label:"القراءات والفواتير"},
  {id:"archive",icon:"🗂️",label:"الأرشيف"},
  {id:"profile",icon:"👤",label:"ملف المنخرط"},
  {id:"report",icon:"📈",label:"التقارير الشهرية"},
  {id:"sendlog",icon:"📱",label:"سجل الإرسال"},
  {id:"settings",icon:"⚙️",label:"الإعدادات"},
];
function navigate(pid){
  currentPage=pid;
  var nis=document.querySelectorAll(".ni");
  for(var i=0;i<nis.length;i++){
    if(nis[i].getAttribute("data-page")===pid){nis[i].className="ni act";}
    else{nis[i].className="ni";}
  }
  var pgs=document.querySelectorAll(".pg");
  for(var j=0;j<pgs.length;j++){
    if(pgs[j].id==="pg-"+pid){pgs[j].style.display="block";}
    else{pgs[j].style.display="none";}
  }
  renderPage(pid);
}
function renderNav(){
  var navlist=document.getElementById("navlist");
  navlist.innerHTML="";
  var unpaid=DB.invoices.filter(function(x){return !x.paid;}).length;
  PAGES.forEach(function(p){
    var li=document.createElement("li");
    li.className="ni"+(currentPage===p.id?" act":"");
    li.setAttribute("data-page",p.id);
    var badge="";
    if(p.id==="archive"&&unpaid>0)badge='<span class="nbdg">'+unpaid+'</span>';
    if(p.id==="sendlog"&&DB.sendLogs.length>0)badge='<span class="nbdg wa">'+DB.sendLogs.length+'</span>';
    li.innerHTML='<span>'+p.icon+'</span><span>'+p.label+'</span>'+badge;
    li.onclick=function(){navigate(p.id);toggleMobileNav(false);};
    navlist.appendChild(li);
  });
  var orgName=(DB.settings&&DB.settings.orgName)||"البركة";
  document.getElementById("nav-orgname").textContent=orgName;
  var tbn=document.getElementById("tb-orgname");
  if(tbn)tbn.textContent=orgName;
}
function toggleMobileNav(force){
  var nav=document.getElementById("mainNav");
  var ovl=document.getElementById("nav-ovl");
  var open=(typeof force==="boolean")?force:!nav.classList.contains("open");
  if(open){nav.classList.add("open");ovl.classList.add("open");document.body.style.overflow="hidden";}
  else{nav.classList.remove("open");ovl.classList.remove("open");document.body.style.overflow="";}
}
window.addEventListener("resize",function(){
  if(window.innerWidth>800)toggleMobileNav(false);
});
function ensurePages(){
  var main=document.getElementById("main-content");
  PAGES.forEach(function(p){
    if(!document.getElementById("pg-"+p.id)){
      var div=document.createElement("div");
      div.className="pg";
      div.id="pg-"+p.id;
      div.style.display=(p.id===currentPage?"block":"none");
      main.appendChild(div);
    }
  });
}
function renderPage(pid){
  var el=document.getElementById("pg-"+pid);
  if(!el)return;
  if(pid==="dashboard")renderDashboard(el);
  else if(pid==="regions")renderRegions(el);
  else if(pid==="customers")renderCustomers(el);
  else if(pid==="readings")renderReadings(el);
  else if(pid==="archive")renderArchive(el);
  else if(pid==="profile")renderProfile(el);
  else if(pid==="report")renderReport(el);
  else if(pid==="sendlog")renderSendLog(el);
  else if(pid==="settings")renderSettings(el);
}
function render(){renderNav();renderPage(currentPage);}

window.saveCust=function(id){

    regionId:document.getElementById("c-region").value,
    defRent:parseFloat(document.getElementById("c-rent").value)||0,
    defMaint:parseFloat(document.getElementById("c-maint").value)||0,
    defInsp:parseFloat(document.getElementById("c-insp").value)||0,
    defTrans:parseFloat(document.getElementById("c-trans").value)||0,
    defSub:parseFloat(document.getElementById("c-sub").value)||0,
    debt:parseFloat(document.getElementById("c-debt").value)||0};
  if(!f.name){showToast("يرجى إدخال الاسم","err");return;}
  if(!f.regionId){showToast("يرجى اختيار المنطقة","err");return;}
  if(id&&id!=="null"&&id!==""){
    persist(_merge(DB,{customers:DB.customers.map(function(x){return x.id===id?_merge(x,f):x;})}));
    showToast("✅ تم التحديث");
  } else {
    persist(_merge(DB,{customers:DB.customers.concat([_merge({id:gid(),debt:0},f)])}));
    showToast("✅ تمت الإضافة");
  }
  closeModal();
};
window.delCust=function(id){
  if(!confirm("حذف المنخرط وكل فواتيره؟"))return;
  persist(_merge(DB,{
    customers:DB.customers.filter(function(x){return x.id!==id;}),
    readings:DB.readings.filter(function(x){return x.customerId!==id;}),
    invoices:DB.invoices.filter(function(x){return x.customerId!==id;})
  }));
  showToast("🗑️ تم الحذف","err");
};

function buildAnnualReportHTML(cid,year){

  var totalDue=invs.reduce(function(s,x){return s+(x.totalDue||0);},0);

    +'.hd h1{font-size:18px;margin-bottom:4px}.hd p{font-size:12px;opacity:.85}'
    +'table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:13px}'
    +'th{background:#0f2b4a;color:#fff;padding:8px}'
    +'td{padding:7px 8px;border-bottom:1px solid #e2e8f0;text-align:center}'
    +'tr:nth-child(even) td{background:#f8fafc}'
    +'.tot{background:#0f2b4a;color:#fff;padding:14px;border-radius:8px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;flex-wrap:wrap;gap:6px}'
    +'@media print{body{padding:0}}</style></head><body>'
    +'<div class="hd"><h1>التقرير السنوي — '+year+'</h1>'
    +'<p>'+c.name+' — '+(r?r.name:"—")+' — رقم العداد: '+(c.meterNo||"—")+'</p></div>'
    +(invs.length>0?'<table><thead><tr><th>الشهر</th><th>الاستهلاك</th><th>سعر الوحدة</th><th>الواجب</th><th>الحالة</th></tr></thead><tbody>'+rows+'</tbody></table>'
      :'<p style="text-align:center;color:#94a3b8;padding:20px">لا توجد فواتير لهذه السنة</p>')
    +'<div class="tot"><span>الإجمالي: '+n2(totalDue)+' درهم</span><span>المحصّل: '+n2(totalPaid)+' درهم</span><span>المتبقي: '+n2(totalDue-totalPaid)+' درهم</span></div>'
    +'<div style="text-align:center;margin-top:20px;color:#94a3b8;font-size:11px">'+orgName+'</div>'
    +'</body></html>';
}
window.downloadAnnualReport=function(cid,year){
  var c=DB.customers.find(function(x){return x.id===cid;});
  if(!c)return;
  var html=buildAnnualReportHTML(cid,year);
  try{
    var blob=new Blob([html],{type:"text/html;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;
    a.download="تقرير_سنوي_"+c.name.replace(/\s+/g,"_")+"_"+year+".html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
    showToast("⬇️ تم تحميل التقرير");
  }catch(e){
    showToast("تعذّر التحميل","err");
  }
};
window.printSingleAnnualReport=function(cid,year){
  var html=buildAnnualReportHTML(cid,year);
  if(!html)return;
  var iframe=document.getElementById("_print_frame");
  if(iframe)iframe.remove();
  iframe=document.createElement("iframe");
  iframe.id="_print_frame";
  iframe.style.cssText="position:fixed;top:-9999px;left:-9999px;width:210mm;height:297mm;border:none;visibility:hidden";
  document.body.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(html);
  iframe.contentDocument.close();
  iframe.onload=function(){setTimeout(function(){iframe.contentWindow.focus();iframe.contentWindow.print();},500);};
  showToast("🖨️ جاري تحضير التقرير...");
};

function buildAnnualWAMsg(cid,year){
  var c=DB.customers.find(function(x){return x.id===cid;});
  var r=DB.regions.find(function(x){return x.id===(c?c.regionId:null);});
  var invs=DB.invoices.filter(function(x){return x.customerId===cid&&x.year===year;});
  var totalDue=invs.reduce(function(s,x){return s+(x.totalDue||0);},0);
  var totalPaid=invs.filter(function(x){return x.paid;}).reduce(function(s,x){return s+(x.totalDue||0);},0);
  var totalCons=invs.reduce(function(s,x){return s+(x.consumption||0);},0);
  var pct=invs.length>0?Math.round(invs.filter(function(x){return x.paid;}).length/invs.length*100):0;
  return "السلام عليكم "+(c?c.name:"")+" 🌙\n\n"
    +"━━━━━━━━━━━━━━━━━\n"
    +"📆 *التقرير السنوي — "+year+"*\n"
    +"🏘️ المنطقة: "+(r?r.name:"—")+"\n"
    +"━━━━━━━━━━━━━━━━━\n"
    +"⚡ عدد الفواتير: "+invs.length+"\n"
    +"🔢 إجمالي الاستهلاك: "+totalCons+" كيلواط\n"
    +"💵 إجمالي الواجب: "+n2(totalDue)+" درهم\n"
    +"✅ المحصّل: "+n2(totalPaid)+" درهم\n"
    +"⏳ المتبقي: "+n2(totalDue-totalPaid)+" درهم\n"
    +"📊 نسبة التحصيل: "+pct+"٪\n"
    +"━━━━━━━━━━━━━━━━━";
}
window.sendAnnualReportWA=function(cid,year){
  var c=DB.customers.find(function(x){return x.id===cid;});
  if(!c||!c.phone){alert("لا يوجد رقم هاتف لهذا المنخرط");return;}
  var phone=fmtPhone(c.phone);
  if(!phone||phone.length<11){alert("رقم الهاتف غير صحيح: "+c.phone);return;}
  var url="https://wa.me/"+phone+"?text="+encodeURIComponent(buildAnnualWAMsg(cid,year));
  window.open(url,"_blank");
  closeModal();
  showToast("📱 تم فتح واتساب");
};

window.togglePaid=function(id){
  var inv=DB.invoices.find(function(x){return x.id===id;});
  if(!inv) return;
  var newPaid=!inv.paid;
  var newInvoices=DB.invoices.map(function(x){return x.id===id?_merge(x,{paid:newPaid}):x;});
  // ترحيل الذمة تلقائياً للشهر التالي
  if(!newPaid){
    // أصبحت غير مؤداة — أضف مبلغها لذمة المنخرط
    var cust=DB.customers.find(function(x){return x.id===inv.customerId;});
    if(cust){
      var newDebt=ceil2((cust.debt||0)+(inv.totalDue||0));
      var newCustomers=DB.customers.map(function(x){return x.id===cust.id?_merge(x,{debt:newDebt}):x;});
      persist(_merge(DB,{invoices:newInvoices,customers:newCustomers}));
      showToast("✗ غير مؤداة — تم إضافة "+n2(inv.totalDue)+" درهم للذمة","err");
      return;
    }
  } else {
    // أصبحت مؤداة — احذف مبلغها من ذمة المنخرط إن وُجد
    var cust2=DB.customers.find(function(x){return x.id===inv.customerId;});
    if(cust2&&(cust2.debt||0)>0){
      var newDebt2=Math.max(0,ceil2((cust2.debt||0)-(inv.totalDue||0)));
      var newCustomers2=DB.customers.map(function(x){return x.id===cust2.id?_merge(x,{debt:newDebt2}):x;});
      persist(_merge(DB,{invoices:newInvoices,customers:newCustomers2}));
      showToast("✓ مؤداة — تم تحديث الذمة");
      if(confirm("🧾 هل تريد طباعة وصل استخلاص الآن؟"))printReceiptById(id);
      return;
    }
  }
  persist(_merge(DB,{invoices:newInvoices}));
  showToast(newPaid?"✓ مؤداة":"✗ غير مؤداة");
  if(newPaid&&confirm("🧾 هل تريد طباعة وصل استخلاص الآن؟"))printReceiptById(id);
};

window.updateMonthlyBill=function(regionId,year,month,amount){
  var bill=parseFloat(amount)||0;
  if(bill<=0){showToast("يرجى إدخال مبلغ صحيح","err");return;}
  var key=regionId+"_"+year+"_"+month;
  var nBills=_merge(DB.regionBills||{});
  nBills[key]=bill;
  var region=DB.regions.find(function(r){return r.id===regionId;});
  if(!region){persist(_merge(DB,{regionBills:nBills}));return;}

  // جمع الاستهلاك من الفواتير الموجودة (للمناطق التي لا تملك readings)
  var existingInvs=DB.invoices.filter(function(x){
    return x.regionId===regionId&&x.year===year&&x.month===month;
  });
  // أيضاً من readings إن وجدت
  var custs=getCusts(regionId);
  var allReadings=DB.readings.filter(function(r){
    return custs.some(function(c){return c.id===r.customerId;})&&r.year===year&&r.month===month;
  });

  // حساب مجموع الاستهلاك من المصدرين
  var totC=0;
  if(allReadings.length>0){
    totC=allReadings.reduce(function(s,r){return s+Math.max(0,r.curr-r.prev);},0);
  } else {
    totC=existingInvs.reduce(function(s,x){return s+(x.consumption||0);},0);
  }

  var up=(totC>0&&bill>615.60)?ceil2p((bill-615.60)/totC):0;

  // تحديث كل الفواتير الموجودة بالسعر الجديد
  var nI=DB.invoices.map(function(inv){
    if(inv.regionId!==regionId||inv.year!==year||inv.month!==month) return inv;
    var ca=totC>0?ceil2(inv.consumption*up):zeroShare(bill,totC,allReadings.length>0?allReadings.length:existingInvs.length);
    var td=ceil2(ca+(inv.meterRent||0)+(inv.meterMaint||0)+(inv.inspector||0)
      +(inv.transformerMaint||0)+(inv.bankFees||0)+(inv.subscription||0)
      +(inv.lateFees||0)+(inv.studyFees||0)+(inv.debt||0));
    return _merge(inv,{unitPrice:up,consumptionAmt:ca,totalDue:td});
  });

  persist(_merge(DB,{regionBills:nBills,invoices:nI}));
  showToast(totC>0?"✅ تم التحديث — سعر الوحدة: "+n2(up)+" درهم/ك":"✅ استهلاك صفري: تم تقسيم (المبلغ − 615.60) بالتساوي = "+n2(zeroShare(bill,totC,allReadings.length>0?allReadings.length:existingInvs.length))+" درهم لكل منخرط");
};
window.bulkPrint=function(){
  var selR=readState.selR,selY=readState.selY,selM=readState.selM;
  var region=DB.regions.find(function(r){return r.id===selR;});
  var custs=getCusts(selR);
  var invList=[];
  custs.forEach(function(c){var inv=getInv(c.id,selY,selM);if(inv&&region)invList.push({inv:inv,c:c,r:region});});
  if(invList.length===0){showToast("لا توجد فواتير للطباعة","err");return;}
  var allHTML=invList.map(function(x){return invoiceHTML(x.inv,x.c,x.r);}).join('<div style="page-break-after:always"></div>');
  var fullDoc='<!DOCTYPE html><html><head><meta charset="UTF-8"/>'
    +'<style>@media print{@page{size:A4;margin:8mm 10mm}.pb{page-break-after:always}}</style>'
    +'</head><body>'+allHTML+'<script>window.onload=function(){window.print();}<\/script></body></html>';
  var iframe=document.getElementById("_pf");
  if(iframe)iframe.remove();
  iframe=document.createElement("iframe");
  iframe.id="_pf";
  iframe.style.cssText="position:fixed;top:-9999px;left:-9999px;width:210mm;height:297mm;border:none;visibility:hidden";
  document.body.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(fullDoc);
  iframe.contentDocument.close();
  showToast("🖨️ جاري تحضير "+invList.length+" فاتورة...");
};

window.bulkWAsend=function(){
  var cur=_bulkWA.custs[_bulkWA.idx];
  var curInv=getInv(cur.id,_bulkWA.selY,_bulkWA.selM);

window.updateRC=function(){
  var prev=parseFloat((document.getElementById("rd-prev")||{}).value||0);
  var curr=parseFloat((document.getElementById("rd-curr")||{}).value||0);
  var warnEl=document.getElementById("rd-warn");
  if(warnEl){
    var currRaw=(document.getElementById("rd-curr")||{}).value;
    if(currRaw!==""&&currRaw!==undefined&&curr<prev){warnEl.style.display="block";}
    else{warnEl.style.display="none";}
  }
  var cons=Math.max(0,curr-prev);
  if(document.getElementById("rd-cons"))document.getElementById("rd-cons").value=cons;
  var pcd=(document.getElementById("rd-pcd")||{}).value||"";
  var cm2=consumptionMonth(pcd);
  if(document.getElementById("rd-mth"))document.getElementById("rd-mth").textContent=cm2?cm2.label:"—";
  var meta=window._rdMeta;if(!meta)return;
  var region=meta.region,customer=meta.customer,cid=meta.cid,y=meta.y,m=meta.m,rid=meta.rid;
  var bill=getRegionBill(rid,y,m);
  var custs=getCusts(rid);
  var otherR=DB.readings.filter(function(r){return r.customerId!==cid&&custs.some(function(c){return c.id===r.customerId;})&&r.year===y&&r.month===m;});
  var oCons=otherR.reduce(function(s,r){return s+Math.max(0,r.curr-r.prev);},0);
  var totC=oCons+cons;
  var up=(totC>0&&bill>615.60)?ceil2p((bill-615.60)/totC):0;
  var ca=totC>0?ceil2(cons*up):zeroShare(bill,totC,(otherR.length+1));
  var rent=parseFloat((document.getElementById("rd-rent")||{}).value||0);
  var maint=parseFloat((document.getElementById("rd-maint")||{}).value||0);
  var insp=parseFloat((document.getElementById("rd-insp")||{}).value||0);
  var trans=parseFloat((document.getElementById("rd-trans")||{}).value||0);
  var bank=parseFloat((document.getElementById("rd-bank")||{}).value||0);
  var sub=parseFloat((document.getElementById("rd-sub")||{}).value||0);
  var late=parseFloat((document.getElementById("rd-late")||{}).value||0);
  var study=parseFloat((document.getElementById("rd-study")||{}).value||0);
  var debt=parseFloat((document.getElementById("rd-debt")||{}).value||0);
  var td=ceil2(ca+rent+maint+insp+trans+bank+sub+late+study+debt);
  if(document.getElementById("rd-tc"))document.getElementById("rd-tc").textContent=totC+" كيلواط";
  if(document.getElementById("rd-up"))document.getElementById("rd-up").textContent=n2(up)+" درهم/ك";
  if(document.getElementById("rd-ca"))document.getElementById("rd-ca").textContent=n2(ca)+" درهم";
  if(document.getElementById("rd-rent-lbl"))document.getElementById("rd-rent-lbl").textContent=n2(rent)+" درهم";
  if(document.getElementById("rd-maint-lbl"))document.getElementById("rd-maint-lbl").textContent=n2(maint)+" درهم";
  if(document.getElementById("rd-trans-lbl"))document.getElementById("rd-trans-lbl").textContent=n2(trans)+" درهم";
  if(document.getElementById("rd-insp-lbl"))document.getElementById("rd-insp-lbl").textContent=n2(insp)+" درهم";
  if(document.getElementById("rd-bank-lbl"))document.getElementById("rd-bank-lbl").textContent=n2(bank)+" درهم";
  if(document.getElementById("rd-sub-lbl"))document.getElementById("rd-sub-lbl").textContent=n2(sub)+" درهم";
  if(document.getElementById("rd-late-lbl"))document.getElementById("rd-late-lbl").textContent=n2(late)+" درهم";
  if(document.getElementById("rd-study-lbl"))document.getElementById("rd-study-lbl").textContent=n2(study)+" درهم";
  if(document.getElementById("rd-debt-lbl"))document.getElementById("rd-debt-lbl").textContent=n2(debt)+" درهم";
  if(document.getElementById("rd-tot"))document.getElementById("rd-tot").textContent=n2(td)+" درهم";

window.saveReading=function(cid,rid,y,m){
  var prev=parseFloat(document.getElementById("rd-prev").value||0);
  var curr=parseFloat(document.getElementById("rd-curr").value||0);
  if(document.getElementById("rd-curr").value!==""&&curr<prev){
    if(!confirm("⚠️ تنبيه: البيان الحالي ("+curr+") أقل من البيان السابق ("+prev+")!\n\nهل أنت متأكد من صحة الأرقام وتريد المتابعة رغم ذلك؟")){
      return;
    }
  }
  var pcd=document.getElementById("rd-pcd").value;
  var ncd=document.getElementById("rd-ncd").value;
  var isd=document.getElementById("rd-isd").value;
  var due=document.getElementById("rd-due").value;
  var paid=document.getElementById("rd-paid").checked;
  var trans=parseFloat(document.getElementById("rd-trans").value||0);
  var rent=parseFloat(document.getElementById("rd-rent").value||0);
  var maint=parseFloat(document.getElementById("rd-maint").value||0);
  var insp=parseFloat(document.getElementById("rd-insp").value||0);
  var bank=parseFloat(document.getElementById("rd-bank").value||0);
  var sub=parseFloat(document.getElementById("rd-sub").value||0);
  var late=parseFloat(document.getElementById("rd-late").value||0);
  var study=parseFloat(document.getElementById("rd-study").value||0);
  var debt=parseFloat(document.getElementById("rd-debt").value||0);
  var region=DB.regions.find(function(x){return x.id===rid;});
  var customer=DB.customers.find(function(x){return x.id===cid;});
  var reading={customerId:cid,year:y,month:m,prev:prev,curr:curr};
  var existR=DB.readings.find(function(x){return x.customerId===cid&&x.year===y&&x.month===m;});
  var nR=existR?DB.readings.map(function(x){return(x.customerId===cid&&x.year===y&&x.month===m)?reading:x;}):[].concat(DB.readings,[reading]);
  var bill=getRegionBill(rid,y,m);
  var custs=getCusts(rid);
  var allR=nR.filter(function(r){return custs.some(function(c){return c.id===r.customerId;})&&r.year===y&&r.month===m;});
  var totC=allR.reduce(function(s,r){return s+Math.max(0,r.curr-r.prev);},0);
  var up=(totC>0&&bill>615.60)?ceil2p((bill-615.60)/totC):0;
  var nI=DB.invoices.slice();
  allR.forEach(function(r){
    var cust=DB.customers.find(function(x){return x.id===r.customerId;});if(!cust)return;
    var cons=Math.max(0,r.curr-r.prev);
    var ca=totC>0?ceil2(cons*up):zeroShare(bill,totC,allR.length);
    var isCur=r.customerId===cid;
    var ex=nI.find(function(x){return x.customerId===r.customerId&&x.year===y&&x.month===m;});
    var rRent=isCur?rent:(ex?(ex.meterRent||0):region.meterRent);
    var rMaint=isCur?maint:(ex?(ex.meterMaint||0):region.meterMaint);
    var rInsp=isCur?insp:(ex?(ex.inspector||0):region.inspector);
    var rTrans=isCur?trans:(ex?ex.transformerMaint:region.transformerMaint);
    var rBank=isCur?bank:(ex?(ex.bankFees||0):0);
    var rSub=isCur?sub:(ex?(ex.subscription||0):0);
    var rLate=isCur?late:(ex?(ex.lateFees||0):0);
    var rStudy=isCur?study:(ex?(ex.studyFees||0):0);
    var rDebt=isCur?debt:(ex?(ex.debt||0):(cust.debt||0));
    var td=ceil2(ca+rRent+rMaint+rInsp+rTrans+rBank+rSub+rLate+rStudy+rDebt);
    var ni={id:ex?ex.id:gid(),customerId:r.customerId,regionId:rid,year:y,month:m,
      prevReading:r.prev,currReading:r.curr,consumption:cons,unitPrice:up,consumptionAmt:ca,
      meterRent:rRent,meterMaint:rMaint,
      transformerMaint:rTrans,inspector:rInsp,
      bankFees:rBank,subscription:rSub,lateFees:rLate,studyFees:rStudy,
      debt:rDebt,totalDue:td,
      paid:isCur?paid:(ex?ex.paid:false),
      issuedDate:isCur?isd:(ex?ex.issuedDate:""),
      dueDate:isCur?due:(ex?ex.dueDate:""),
      newCheckDate:isCur?ncd:(ex?ex.newCheckDate:""),
      prevCheckDate:isCur?pcd:(ex?ex.prevCheckDate:"")};
    if(ex){nI=nI.map(function(x){return x.id===ex.id?ni:x;});}
    else{nI=nI.concat([ni]);}
  });
  persist(_merge(DB,{readings:nR,invoices:nI}));
  showToast("✅ تم الحفظ — سعر الوحدة: "+n2(up)+" درهم/ك (موحد للمنطقة)");
  closeModal();
};

window.printAnnualReport=function(cid){
  var c=DB.customers.find(function(x){return x.id===cid;});
  var r=DB.regions.find(function(x){return x.id===(c?c.regionId:null);});
  if(!c) return;
  var invs=DB.invoices.filter(function(x){return x.customerId===cid;})
    .sort(function(a,b){return (a.year*100+a.month)-(b.year*100+b.month);});
  var years={};
  invs.forEach(function(inv){
    if(!years[inv.year]) years[inv.year]={cons:0,due:0,paid:0,count:0,paidCount:0,invs:[]};
    years[inv.year].cons+=inv.consumption||0;
    years[inv.year].due+=inv.totalDue||0;
    if(inv.paid){years[inv.year].paid+=inv.totalDue||0;years[inv.year].paidCount++;}
    years[inv.year].count++;
    years[inv.year].invs.push(inv);
  });
  var yearKeys=Object.keys(years).sort(function(a,b){return b-a;});
  var orgName=DB.settings&&DB.settings.orgName?DB.settings.orgName:"";

    var yd=years[y];
    var monthRows="";
    yd.invs.forEach(function(inv){
      monthRows+='<tr><td>'+ml(inv.year,inv.month)+'</td><td>'+inv.consumption+' ك</td><td>'+n2(inv.totalDue)+' درهم</td><td>'+(inv.paid?'✓ مؤداة':'✗ غير مؤداة')+'</td></tr>';

      +'<table style="width:100%;border-collapse:collapse;margin-bottom:10px;font-size:12px">'
      +'<tr style="background:#0f2b4a;color:#fff"><th style="padding:6px">الشهر</th><th style="padding:6px">الاستهلاك</th><th style="padding:6px">المبلغ</th><th style="padding:6px">الحالة</th></tr>'
      +monthRows
      +'<tr style="background:#f1f5f9;font-weight:700"><td style="padding:6px" colspan="2">الإجمالي '+y+'</td><td style="padding:6px">'+n2(yd.due)+' درهم</td><td style="padding:6px">'+yd.paidCount+'/'+yd.count+'</td></tr>'
      +'</table>';

  var totalDue=invs.reduce(function(s,x){return s+(x.totalDue||0);},0);
  var totalPaid=invs.filter(function(x){return x.paid;}).reduce(function(s,x){return s+(x.totalDue||0);},0);
  var html='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><title>التقرير السنوي - '+c.name+'</title>'
    +'<style>body{font-family:Arial,sans-serif;padding:20px;max-width:700px;margin:0 auto;direction:rtl}'
    +'.hd{background:linear-gradient(135deg,#0f2b4a,#1a4a7a);color:#fff;padding:18px;border-radius:8px;margin-bottom:16px}'
    +'.hd h1{font-size:18px;margin-bottom:4px}.hd p{font-size:12px;opacity:.8}'
    +'table th,table td{border:1px solid #e2e8f0;text-align:center}'
    +'.tot{background:#0f2b4a;color:#fff;padding:14px;border-radius:8px;display:flex;justify-content:space-between;margin-top:16px;font-size:14px;font-weight:700}'
    +'@media print{body{padding:0}}</style></head><body>'
    +'<div class="hd"><h1>التقرير السنوي الشامل — '+c.name+'</h1>'
    +'<p>المنطقة: '+(r?r.name:"—")+' — رقم العداد: '+(c.meterNo||"—")+'</p></div>'
    +sections
    +'<div class="tot"><span>الإجمالي الكلي: '+n2(totalDue)+' درهم</span><span>المحصّل: '+n2(totalPaid)+' درهم</span><span>المتبقي: '+n2(totalDue-totalPaid)+' درهم</span></div>'
    +'<div style="text-align:center;margin-top:20px;color:#94a3b8;font-size:11px">'+orgName+'</div>'
    +'</body></html>';

  iframe=document.createElement("iframe");
  iframe.id="_print_frame";
  iframe.style.cssText="position:fixed;top:-9999px;left:-9999px;width:210mm;height:297mm;border:none;visibility:hidden";
  document.body.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(html);
  iframe.contentDocument.close();
  iframe.onload=function(){setTimeout(function(){iframe.contentWindow.focus();iframe.contentWindow.print();},500);};
};

var annualRF="all",annualSrch="";
function buildAnnualCustRows(y){
  var ropts='<option value="all">جميع المناطق</option>';
  DB.regions.forEach(function(r){ropts+='<option value="'+r.id+'"'+(annualRF===r.id?' selected':'')+'>'+r.name+'</option>';});
  var custs=DB.customers.filter(function(c){
    if(annualRF!=="all"&&c.regionId!==annualRF)return false;
    if(annualSrch&&c.name.indexOf(annualSrch)<0&&(c.meterNo||"").indexOf(annualSrch)<0)return false;
    return true;
  });
  var data=custs.map(function(c){
    var invs=DB.invoices.filter(function(x){return x.customerId===c.id&&x.year===y;});
    var reg=DB.regions.find(function(x){return x.id===c.regionId;});
    var due=invs.reduce(function(s,x){return s+(x.totalDue||0);},0);
    var paid=invs.filter(function(x){return x.paid;}).reduce(function(s,x){return s+(x.totalDue||0);},0);
    var cons=invs.reduce(function(s,x){return s+(x.consumption||0);},0);
    return{c:c,reg:reg,count:invs.length,cons:cons,due:due,paid:paid};
  }).filter(function(d){return d.count>0;});
  return{ropts:ropts,data:data};
}

window.saveLockSettings=function(){
  var pwd=document.getElementById("s-pwd").value;
  var pwd2=document.getElementById("s-pwd2").value;
  var enabled=document.getElementById("s-lock-enabled").checked;
  var newSettings=_merge(DB.settings||{},{passwordEnabled:enabled});
  var hadPwdBefore=!!(DB.settings&&DB.settings.password&&DB.settings.password.length>=4);
  if(pwd.length>0){
    if(pwd.length<4){showToast("كلمة المرور يجب أن تكون 4 أحرف على الأقل","err");return;}
    if(pwd!==pwd2){showToast("كلمتا المرور غير متطابقتين","err");return;}
    newSettings.password=pwd;
  }
  persist(_merge(DB,{settings:newSettings}));
  // مسح جلسة الدخول لتطبيق التغييرات فوراً
  try{localStorage.removeItem("elbaraka_auth");localStorage.removeItem("lastAuth");}catch(e){}
  if(enabled){
    if(!hadPwdBefore&&pwd.length===0){
      showToast("🔐 القفل مفعّل — كلمة المرور الافتراضية: 1234","info");

// ══════════════════════════════════════════════════════
// تصدير Excel — ملف .xlsx حقيقي (OOXML) بدون أي مكتبة خارجية
// كل منطقة في ورقة مستقلة + تقرير سنوي/شهري داخل كل ورقة
// ══════════════════════════════════════════════════════
function xUtf8Bytes(str){
  var out=[];
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c<0x80){out.push(c);}
    else if(c<0x800){out.push(0xc0|(c>>6),0x80|(c&0x3f));}
    else if(c>=0xd800&&c<=0xdbff&&i+1<str.length&&str.charCodeAt(i+1)>=0xdc00&&str.charCodeAt(i+1)<=0xdfff){
      var c2=str.charCodeAt(++i);
      var cp=0x10000+((c-0xd800)<<10)+(c2-0xdc00);
      out.push(0xf0|(cp>>18),0x80|((cp>>12)&0x3f),0x80|((cp>>6)&0x3f),0x80|(cp&0x3f));
    } else {
      out.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f));
    }
  }
  return out;
}
var X_CRC_TABLE=(function(){
  var t=[];
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++){c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);}
    t[n]=c>>>0;
  }
  return t;
})();
function xCrc32(bytes){
  var crc=0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++){crc=(crc>>>8)^X_CRC_TABLE[(crc^bytes[i])&0xFF];}
  return (crc^0xFFFFFFFF)>>>0;
}
function xU16(v){return [v&0xFF,(v>>8)&0xFF];}
function xU32(v){return [v&0xFF,(v>>8)&0xFF,(v>>16)&0xFF,(v>>24)&0xFF];}
function xBuildZip(files){
  var localParts=[],central=[],offset=0;
  files.forEach(function(f){
    var nameBytes=xUtf8Bytes(f.name);
    var dataBytes=xUtf8Bytes(f.data);
    var crc=xCrc32(dataBytes);
    var size=dataBytes.length;
    var localHeader=[].concat(
      xU32(0x04034b50),xU16(20),xU16(0),xU16(0),xU16(0),xU16(0),
      xU32(crc),xU32(size),xU32(size),
      xU16(nameBytes.length),xU16(0)
    );
    var localEntry=localHeader.concat(nameBytes,dataBytes);
    localParts.push(localEntry);
    var centralHeader=[].concat(
      xU32(0x02014b50),xU16(20),xU16(20),xU16(0),xU16(0),xU16(0),xU16(0),
      xU32(crc),xU32(size),xU32(size),
      xU16(nameBytes.length),xU16(0),xU16(0),xU16(0),xU16(0),
      xU32(0),xU32(offset)
    ).concat(nameBytes);
    central.push(centralHeader);
    offset+=localEntry.length;
  });
  var localAll=[].concat.apply([],localParts);
  var centralAll=[].concat.apply([],central);
  var eocd=[].concat(
    xU32(0x06054b50),xU16(0),xU16(0),
    xU16(files.length),xU16(files.length),
    xU32(centralAll.length),xU32(localAll.length),xU16(0)
  );
  var all=localAll.concat(centralAll,eocd);
  return new Uint8Array(all);
}
function xEsc(s){return String(s===undefined||s===null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function xColLetter(n){var s="";while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function xSheetName(s){
  var n=String(s||"ورقة").replace(/[\\\/\?\*\[\]:]/g,"-");
  return n.length>31?n.slice(0,31):n;
}
function xSheetXML(rows,merges,rtl){
  var rowsXML="";
  rows.forEach(function(row,ri){
    var rIdx=ri+1,cells="";
    row.forEach(function(cell,ci){
      var ref=xColLetter(ci+1)+rIdx;
      var styleAttr=cell.style?(' s="'+cell.style+'"'):"";
      if(cell.t==="n"){
        cells+='<c r="'+ref+'"'+styleAttr+'><v>'+(cell.v===""||cell.v===undefined||isNaN(cell.v)?0:cell.v)+'</v></c>';
      } else {
        cells+='<c r="'+ref+'"'+styleAttr+' t="inlineStr"><is><t xml:space="preserve">'+xEsc(cell.v)+'</t></is></c>';
      }
    });
    rowsXML+='<row r="'+rIdx+'">'+cells+'</row>';
  });
  var mergeXML="";
  if(merges&&merges.length>0){
    mergeXML='<mergeCells count="'+merges.length+'">';
    merges.forEach(function(m){mergeXML+='<mergeCell ref="'+m+'"/>';});
    mergeXML+='</mergeCells>';
  }
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    +'<sheetViews><sheetView'+(rtl?' rightToLeft="1"':'')+' workbookViewId="0"/></sheetViews>'
    +'<sheetData>'+rowsXML+'</sheetData>'

}

    +'<fill><patternFill patternType="solid"><fgColor rgb="FFE8F0FB"/><bgColor indexed="64"/></patternFill></fill>'
    +'</fills>'

    +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    +'<cellXfs count="4">'

    +'<xf numFmtId="0" fontId="2" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'
    +'<xf numFmtId="0" fontId="3" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"><alignment horizontal="center"/></xf>'
    +'</cellXfs>'

}
function xWorkbookXML(names){
  var sheets="";
  names.forEach(function(n,i){sheets+='<sheet name="'+xEsc(xSheetName(n))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';});
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    +'<sheets>'+sheets+'</sheets></workbook>';
}
function xWorkbookRelsXML(sheetCount){
  var rels="";
  for(var i=1;i<=sheetCount;i++){rels+='<Relationship Id="rId'+i+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+i+'.xml"/>';}
  rels+='<Relationship Id="rId'+(sheetCount+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'

}
function xContentTypesXML(sheetCount){
  var overrides="";
  for(var i=1;i<=sheetCount;i++){overrides+='<Override PartName="/xl/worksheets/sheet'+i+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';}
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'

    +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    +overrides+'</Types>';

var X_ROOT_RELS='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
  +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
  +'</Relationships>';
function xBuildWorkbook(sheetsData){ // [{name, rows, merges}]
  var names=sheetsData.map(function(s){return s.name;});
  var files=[
    {name:"[Content_Types].xml",data:xContentTypesXML(sheetsData.length)},
    {name:"_rels/.rels",data:X_ROOT_RELS},
    {name:"xl/workbook.xml",data:xWorkbookXML(names)},
    {name:"xl/_rels/workbook.xml.rels",data:xWorkbookRelsXML(sheetsData.length)},
    {name:"xl/styles.xml",data:xStylesXML()}
  ];
  sheetsData.forEach(function(s,i){
    files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",data:xSheetXML(s.rows,s.merges,true)});
  });
  return xBuildZip(files);
}

function xS(v,style){return{v:v,t:"s",style:style};}
function xN(v,style){return{v:parseFloat(v)||0,t:"n",style:style};}
var XL_COLS=["المنخرط","رقم العداد","السنة","شهر الفاتورة","شهر الاستهلاك",
  "البيان السابق","البيان الحالي","الاستهلاك (ك)","سعر الوحدة","مبلغ الاستهلاك",
  "كراء العداد","صيانة العداد","مراقب العداد","صيانة المحول","رسوم البنك",
  "الاشتراك","مصاريف التأخير","مصاريف الدراسة","الذمة","الواجب أداؤه","الحالة"];
function xInvoiceRow(inv){
  var c=DB.customers.find(function(x){return x.id===inv.customerId;})||{name:"—",meterNo:""};
  var cm=consumptionMonth(inv.prevCheckDate);
  var cml=cm?cm.label:ml(inv.year,inv.month);
  return [
    xS(c.name),xS(c.meterNo||""),xN(inv.year),xS(ml(inv.year,inv.month)),xS(cml),
    xN(inv.prevReading),xN(inv.currReading),xN(inv.consumption),xN(inv.unitPrice),xN(inv.consumptionAmt),
    xN(inv.meterRent||0),xN(inv.meterMaint||0),xN(inv.inspector||0),xN(inv.transformerMaint||0),xN(inv.bankFees||0),
    xN(inv.subscription||0),xN(inv.lateFees||0),xN(inv.studyFees||0),xN(inv.debt||0),xN(inv.totalDue),
    xS(inv.paid?"مؤداة":"غير مؤداة")
  ];

function xAnnualSummaryRows(invs){
  var byYM={};
  invs.forEach(function(inv){
    var k=inv.year+"-"+inv.month;
    if(!byYM[k])byYM[k]={year:inv.year,month:inv.month,count:0,cons:0,due:0,paid:0};
    byYM[k].count++;byYM[k].cons+=inv.consumption||0;byYM[k].due+=inv.totalDue||0;
    if(inv.paid)byYM[k].paid+=inv.totalDue||0;
  });
  var keys=Object.keys(byYM).sort(function(a,b){var A=byYM[a],B=byYM[b];return A.year!==B.year?A.year-B.year:A.month-B.month;});
  var rows=[],merges=[];
  if(keys.length===0)return{rows:rows,merges:merges};
  rows.push([xS("📆 التقرير السنوي / الشهري للمنطقة",3)]);
  merges.push("A"+rows.length+":F"+rows.length);
  rows.push([xS("الشهر",1),xS("عدد الفواتير",1),xS("الاستهلاك",1),xS("الواجب",1),xS("المحصّل",1),xS("نسبة التحصيل",1)]);
  var gDue=0,gPaid=0,gCons=0,gCount=0;
  keys.forEach(function(k){
    var d=byYM[k];
    var pct=d.due>0?Math.round(d.paid/d.due*100):(d.count>0?100:0);
    rows.push([xS(ml(d.year,d.month)),xN(d.count),xN(d.cons),xN(d.due),xN(d.paid),xS(pct+"٪")]);
    gDue+=d.due;gPaid+=d.paid;gCons+=d.cons;gCount+=d.count;
  });
  var gPct=gDue>0?Math.round(gPaid/gDue*100):0;
  rows.push([xS("الإجمالي",2),xN(gCount,2),xN(gCons,2),xN(gDue,2),xN(gPaid,2),xS(gPct+"٪",2)]);
  rows.push([]);rows.push([]); // فاصل
  return{rows:rows,merges:merges};
}
function xRegionSheet(name,invs){
  var summary=xAnnualSummaryRows(invs);

  rows.push(XL_COLS.map(function(h){return xS(h,1);}));

window.importData=function(input){

      }
      // 2) قائمة قراءات: [{customerId|meterNo|name, year, month, prev, curr}]
      var list=Array.isArray(d)?d:(d&&Array.isArray(d.readings)?d.readings:null);

      importReadings(list);
    }catch(err){showToast("خطأ في قراءة الملف","err");}
    input.value="";
  };
  reader.readAsText(file);

    var rBank=ex?(ex.bankFees||0):0,rSub=ex?(ex.subscription||0):(cust.defSub||0);
    var rLate=ex?(ex.lateFees||0):0,rStudy=ex?(ex.studyFees||0):0;
    var rDebt=ex?(ex.debt||0):(cust.debt||0);
    var td=ceil2(ca+rRent+rMaint+rInsp+rTrans+rBank+rSub+rLate+rStudy+rDebt);
    var ni={id:ex?ex.id:gid(),customerId:r.customerId,regionId:rid,year:y,month:m,
      prevReading:r.prev,currReading:r.curr,consumption:cons,unitPrice:up,consumptionAmt:ca,
      meterRent:rRent,meterMaint:rMaint,transformerMaint:rTrans,inspector:rInsp,
      bankFees:rBank,subscription:rSub,lateFees:rLate,studyFees:rStudy,debt:rDebt,totalDue:td,
      paid:ex?ex.paid:false,issuedDate:ex?ex.issuedDate:"",dueDate:ex?ex.dueDate:"",
      newCheckDate:ex?ex.newCheckDate:"",prevCheckDate:ex?ex.prevCheckDate:""};
    res=ex?res.map(function(x){return x.id===ex.id?ni:x;}):res.concat([ni]);
  });
  return res;
}
function importReadings(list){
  var nR=DB.readings.slice(),touched={},ok=0,bad=[];
  list.forEach(function(it,i){
    var c=DB.customers.find(function(x){
      return (it.customerId&&x.id===it.customerId)||(it.meterNo&&String(x.meterNo)===String(it.meterNo))||(it.name&&x.name===it.name);
    });
    var y=parseInt(it.year),m=parseInt(it.month),pv=parseFloat(it.prev),cv=parseFloat(it.curr);
    if(!c||!y||!m||isNaN(pv)||isNaN(cv)){bad.push(i+1);return;}
    var rd={customerId:c.id,year:y,month:m,prev:pv,curr:cv};
    var j=nR.findIndex(function(x){return x.customerId===c.id&&x.year===y&&x.month===m;});
    if(j>=0)nR[j]=rd;else nR.push(rd);
    touched[c.regionId+"|"+y+"|"+m]=1;ok++;
  });
  if(!ok){showToast("لم يُستورد أي سطر — تحقق من الأسماء/العدادات والأرقام","err");return;}
  var nI=DB.invoices.slice();
  Object.keys(touched).forEach(function(k){var p=k.split("|");nI=rebuildRegionInv(p[0],parseInt(p[1]),parseInt(p[2]),nR,nI);});
  persist(_merge(DB,{readings:nR,invoices:nI}));
  showToast("✅ تم استيراد "+ok+" قراءة وتحديث الفواتير"+(bad.length?" — تم تجاهل أسطر: "+bad.slice(0,10).join("،"):""),bad.length?"info":undefined);
}

  if(!confirm("تحذير: سيتم حذف كل البيانات. هل أنت متأكد؟"))return;
  localStorage.removeItem(SK);
  DB=loadDB();
  render();
  showToast("✅ تمت إعادة التعيين");
};

// 1. قفل النظام بكلمة مرور
// ══════════════════════════════════════════════════════
window.logoutApp=function(){
  if(!confirm("🚪 هل تريد تسجيل الخروج من النظام؟\n\nستحتاج لإدخال كلمة المرور مجدداً للدخول."))return;
  toggleMobileNav(false);
  showLockScreen();
};
function checkPassword(){
  // إذا ألغى المستخدم القفل من الإعدادات → لا قفل
  if(DB.settings&&DB.settings.passwordEnabled===false) return true;
  // القفل مفعّل: كلمة المرور مطلوبة في كل مرة يُفتح فيها التطبيق (بدون جلسة مؤقتة)
  return false;
}
function showLockScreen(){
  document.getElementById("app").style.display="none";
  var lock=document.createElement("div");
  lock.id="lock-screen";
  lock.style.cssText="position:fixed;inset:0;background:var(--p);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;direction:rtl";
  lock.innerHTML='<div style="text-align:center;color:#fff;padding:30px">'
    +'<div style="font-size:60px;margin-bottom:16px">⚡</div>'
    +'<div style="font-size:24px;font-weight:900;margin-bottom:6px">نظام البركة</div>'
    +'<div style="font-size:13px;opacity:.6;margin-bottom:30px">أدخل كلمة المرور للدخول</div>'
    +'<input id="pwd-input" type="password" placeholder="كلمة المرور" style="padding:12px 18px;border-radius:8px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:16px;text-align:center;outline:none;width:220px;margin-bottom:12px;font-family:Cairo,Arial,sans-serif"/>'
    +'<br/><button onclick="submitPassword()" style="padding:10px 30px;background:var(--a);border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:Cairo,Arial,sans-serif">دخول</button>'
    +'<div id="pwd-err" style="color:#fca5a5;margin-top:10px;font-size:13px"></div>'
    +'</div>';
  document.body.appendChild(lock);
  document.getElementById("pwd-input").addEventListener("keypress",function(e){if(e.key==="Enter")window.submitPassword();});
  setTimeout(function(){document.getElementById("pwd-input").focus();},200);
}
window.submitPassword=function(){
  var input=document.getElementById("pwd-input").value.trim();
  var pwd=(DB.settings&&DB.settings.password&&DB.settings.password.length>=4)?DB.settings.password:"1234";
  if(input===pwd){
    var ls=document.getElementById("lock-screen");
    if(ls&&ls.parentNode) ls.parentNode.removeChild(ls);
    var app=document.getElementById("app");
    if(app) app.style.display="flex";
  } else {
    var err=document.getElementById("pwd-err");
    if(err) err.textContent="❌ كلمة المرور غير صحيحة";
    var inp=document.getElementById("pwd-input");
    if(inp){inp.value="";inp.focus();}
  }
};

var darkMode=localStorage.getItem("darkMode")==="1";
function applyDarkMode(){
  try{
    if(darkMode){
      document.body.className=(document.body.className||'').replace(/\bdark\b/,'').trim()+' dark';
    } else {
      document.body.className=(document.body.className||'').replace(/\bdark\b/,'').trim();
    }
  }catch(e){}
}
window.toggleDarkMode=function(){
  darkMode=!darkMode;
  localStorage.setItem("darkMode",darkMode?"1":"0");
  applyDarkMode();
  render();
  showToast(darkMode?"🌙 وضع ليلي":"☀️ وضع نهاري");
};

// 3. تغيير حجم الخط
// ══════════════════════════════════════════════════════
var fontSize=parseInt(localStorage.getItem("fontSize")||"14");
function applyFontSize(){
  document.body.style.fontSize=fontSize+"px";
}
window.changeFontSize=function(delta){
  fontSize=Math.min(18,Math.max(11,fontSize+delta));
  localStorage.setItem("fontSize",fontSize);
  applyFontSize();
  showToast("حجم الخط: "+fontSize+"px");
};

document.addEventListener("keydown",function(e){
  if(e.altKey){
    var map={"1":"dashboard","2":"regions","3":"customers","4":"readings","5":"archive","6":"report","7":"settings"};
    if(map[e.key]){e.preventDefault();navigate(map[e.key]);}
    if(e.key==="d"){e.preventDefault();window.toggleDarkMode();}
    if(e.key==="+"||e.key==="="){ e.preventDefault();window.changeFontSize(1);}
    if(e.key==="-"){e.preventDefault();window.changeFontSize(-1);}
  }
  if(e.key==="Escape"){closeModal();}
});

}

}

// تذكير الفواتير غير المستخلصة عند فتح النظام
// ══════════════════════════════════════════════════════
function checkUnpaidReminder(){
  var unpaid=DB.invoices.filter(function(x){return !x.paid;});
  if(unpaid.length===0)return;
  var totalDue=unpaid.reduce(function(s,x){return s+(x.totalDue||0);},0);
  var byCust={};
  unpaid.forEach(function(inv){
    if(!byCust[inv.customerId])byCust[inv.customerId]={count:0,due:0};
    byCust[inv.customerId].count++;
    byCust[inv.customerId].due+=inv.totalDue||0;
  });
  var custIds=Object.keys(byCust).sort(function(a,b){return byCust[b].due-byCust[a].due;});
  var rows="";
  custIds.slice(0,10).forEach(function(cid){
    var c=DB.customers.find(function(x){return x.id===cid;});
    var reg=c?DB.regions.find(function(x){return x.id===c.regionId;}):null;
    rows+='<tr><td><strong>'+(c?c.name:"—")+'</strong></td><td><span class="chip" style="font-size:11px">'+(reg?reg.name:"—")+'</span></td>'
      +'<td>'+byCust[cid].count+'</td><td><strong style="color:var(--r)">'+n2(byCust[cid].due)+' درهم</strong></td></tr>';
  });
  var moreCount=custIds.length-10;
  var html='<div class="mb" onclick="if(event.target===this)closeModal()">'
    +'<div class="md" style="max-width:520px;width:100%">'
    +'<div class="md-hd"><h2>⚠️ تذكير: فواتير غير مستخلصة</h2><button class="md-x" onclick="closeModal()">✕</button></div>'
    +'<div class="sr" style="margin-bottom:16px">'
    +'<div class="src r"><span>عدد الفواتير غير المؤداة</span><strong>'+unpaid.length+'</strong></div>'
    +'<div class="src r"><span>إجمالي المبلغ المستحق</span><strong>'+n2(totalDue)+' درهم</strong></div>'
    +'</div>'
    +(rows?'<div class="tw" style="max-height:280px;overflow-y:auto;margin-bottom:6px"><table><thead><tr><th>المنخرط</th><th>المنطقة</th><th>الفواتير</th><th>المبلغ</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'')
    +(moreCount>0?'<div style="text-align:center;font-size:12px;color:var(--mt);margin:6px 0 14px">و '+moreCount+' منخرط آخر...</div>':'<div style="margin-bottom:14px"></div>')
    +'<div class="ma"><button class="bp" onclick="closeModal();archState.fP=\'unpaid\';archState.fM=0;navigate(\'archive\')">📂 عرض القائمة الكاملة</button>'
    +'<button class="bg" onclick="closeModal()">إغلاق</button></div>'
    +'</div></div>';
  openModal(html);
}
